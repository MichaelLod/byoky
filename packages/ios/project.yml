name: Byoky
options:
  bundleIdPrefix: com.byoky
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 9X22GVKZ85

targets:
  Byoky:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Byoky
      # Chakra Petch and IBM Plex Mono (SIL OFL 1.1), shared with the Mac
      # app's page. Registered in Info.plist under UIAppFonts.
      - path: Fonts
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Byoky/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.byoky.app
        CODE_SIGN_ENTITLEMENTS: Byoky/App/Byoky.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ByokySafariExtension

  # The web extension's provider script runs in the page's world (manifest
  # content_scripts world: MAIN), which is how apps detect Byoky. Safari
  # supports that from 18, so the extension needs iOS 18; on iOS 17 it would
  # install and every app would say Byoky is not installed. The app itself
  # (wallet, in-wallet browser) still runs on 17.
  # packages/extension/tests/manifest.test.ts checks these targets.
  ByokySafariExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SafariExtension
        excludes:
          - Resources
    postBuildScripts:
      - name: Copy web extension
        basedOnDependencyAnalysis: false
        script: |
          # Copy the WXT Safari build with its folder structure intact.
          # Listing the files as sources flattens chunks/, assets/ etc. into
          # one directory, which breaks every path in manifest.json and the
          # HTML pages (and the hashed names change on every build).
          set -euo pipefail
          SRC="${SRCROOT}/SafariExtension/Resources"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ ! -f "$SRC/manifest.json" ]; then
            echo "error: $SRC/manifest.json not found. Run: pnpm --filter @byoky/extension exec wxt build --browser safari && packages/ios/Scripts/copy-wxt-output.sh"
            exit 1
          fi
          mkdir -p "$DST"
          rsync -a --exclude .gitkeep "$SRC/" "$DST/"
    settings:
      base:
        INFOPLIST_FILE: SafariExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.byoky.app.extension
        CODE_SIGN_ENTITLEMENTS: SafariExtension/SafariExtension.entitlements
        OTHER_LDFLAGS: ["-framework", "SafariServices"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  ByokyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ByokyTests
      # Test vectors shared with core and Android (endpoint policy,
      # setup-token shaping); the tests read them from the bundle.
      - path: ../core/tests/vectors
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.byoky.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Byoky

  ByokyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ByokyUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.byoky.app.uitests
        TEST_TARGET_NAME: Byoky
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Byoky

  # The Mac app only carries the Safari extension, which needs Safari 18
  # (see ByokySafariExtension): macOS 13 is the oldest that gets it.
  Byoky (macOS):
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: macOS
        excludes:
          - "SafariExtension-macOS-Info.plist"
          - "SafariExtension-macOS.entitlements"
      - path: Fonts
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: macOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.byoky.app
        CODE_SIGN_ENTITLEMENTS: macOS/Byoky-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Byoky
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSMainStoryboardFile: Main
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        OTHER_LDFLAGS: ["-framework", "SafariServices", "-framework", "WebKit"]
        REGISTER_APP_GROUPS: YES
    dependencies:
      - target: ByokySafariExtension (macOS)

  ByokySafariExtension (macOS):
    type: app-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: SafariExtension
        excludes:
          - Info.plist
          - SafariExtension.entitlements
          - Resources
    postBuildScripts:
      - name: Copy web extension
        basedOnDependencyAnalysis: false
        script: |
          # Copy the WXT Safari build with its folder structure intact.
          # Listing the files as sources flattens chunks/, assets/ etc. into
          # one directory, which breaks every path in manifest.json and the
          # HTML pages (and the hashed names change on every build).
          set -euo pipefail
          SRC="${SRCROOT}/SafariExtension/Resources"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ ! -f "$SRC/manifest.json" ]; then
            echo "error: $SRC/manifest.json not found. Run: pnpm --filter @byoky/extension exec wxt build --browser safari && packages/ios/Scripts/copy-wxt-output.sh"
            exit 1
          fi
          mkdir -p "$DST"
          rsync -a --exclude .gitkeep "$SRC/" "$DST/"
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: macOS/SafariExtension-macOS-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.byoky.app.extension
        CODE_SIGN_ENTITLEMENTS: macOS/SafariExtension-macOS.entitlements
        PRODUCT_NAME: ByokySafariExtension
        OTHER_LDFLAGS: ["-framework", "SafariServices"]
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

schemes:
  Byoky:
    build:
      targets:
        Byoky: all
        ByokySafariExtension: all
        ByokyTests: [test]
        ByokyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ByokyTests
        - ByokyUITests
    archive:
      config: Release
  Byoky (macOS):
    build:
      targets:
        Byoky (macOS): all
        ByokySafariExtension (macOS): all
    run:
      config: Debug
    archive:
      config: Release
