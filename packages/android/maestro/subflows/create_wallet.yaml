appId: com.byoky.app
---
# Requires env: PASSWORD
#
# Welcome → Get Started → password → MainScreen (Wallet tab).
- assertVisible: "Byoky Wallet"
- tapOn: "Get Started"
- assertVisible: "Set Master Password"
- tapOn: "Master password"
- inputText: ${PASSWORD}
- tapOn: "Confirm password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Create Wallet"
# Landing on MainScreen → Wallet tab → empty state.
- assertVisible: "No credentials yet"
