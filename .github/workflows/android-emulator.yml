name: Android emulator

# The Android app's instrumented tests and Maestro UI flows need an emulator,
# which is slow: nightly, on demand, and on pushes and PRs that change the app
# (core's mobile bundle reaches it as packages/android/.../mobile.js).
on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'packages/android/**'
      - 'scripts/android-emulator-tests.sh'
      - '.github/workflows/android-emulator.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'packages/android/**'
      - 'scripts/android-emulator-tests.sh'
      - '.github/workflows/android-emulator.yml'
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  emulator:
    name: Instrumented tests and Maestro flows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The version the flows are run with locally; the zip is checked
      # against the SHA-256 its release publishes.
      MAESTRO_VERSION: 2.5.0
      MAESTRO_SHA256: 9c9a7617b47e21d4a9add205e0a2ec45f71f9fb0cb651051281afbc3f87158ea
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Lets the runner user open /dev/kvm, so the emulator is hardware
      # accelerated (as android-emulator-runner's README describes).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      # API 36 (the app's targetSdk) with Google APIs, whose WebView runs the
      # JavaScriptSandbox the translation tests use. The action boots the
      # emulator, waits for it and runs the script (one line per command).
      - name: Instrumented tests and Maestro flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: bash scripts/android-emulator-tests.sh "${{ runner.temp }}/android-emulator-tests"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-emulator-reports
          path: |
            packages/android/app/build/reports/androidTests/
            packages/android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/android-emulator-tests/
          retention-days: 7
