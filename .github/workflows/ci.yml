name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR supersedes its run; branch pushes each get a
  # full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Active and maintenance LTS. Node 20 reached end of life on
        # 2026-04-30; the published packages require >=22.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @byoky/core build && pnpm --filter @byoky/sdk build

      - name: Run tests
        run: pnpm test

      - name: Build extension
        run: pnpm --filter @byoky/extension build

      - name: Build landing page
        run: pnpm --filter @byoky/web build
