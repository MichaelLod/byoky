name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  schedule:
    # Nightly, so the iOS suite (path-filtered on push and PR) still runs
    # against changes made elsewhere, e.g. in core's mobile bundle.
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR supersedes its run; branch pushes each get a
  # full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Active and maintenance LTS. Node 20 reached end of life on
        # 2026-04-30; the published packages require >=22.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        id: build
        run: pnpm --filter @byoky/core build && pnpm --filter @byoky/sdk build

      - name: Run tests
        run: pnpm test

      - name: Build extension
        run: pnpm --filter @byoky/extension build

      - name: Build landing page
        run: pnpm --filter @byoky/web build

      # The drift checks below come last and run whenever core built, so a
      # stale copy reports itself without hiding the test and build results
      # above, and a failure above doesn't hide the drift.

      # The iOS and Android apps run a committed copy of core's translate
      # bundle. The build is byte-identical on every Node version (esbuild),
      # so a difference means the copies are stale.
      - name: Mobile bundle copies match core
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          FAIL=0
          for copy in packages/ios/Byoky/Resources/mobile.js packages/android/app/src/main/assets/mobile.js; do
            if ! cmp -s packages/core/dist/mobile.js "$copy"; then
              echo "::error file=$copy::$copy differs from packages/core/dist/mobile.js. Run: pnpm --filter @byoky/core build && scripts/sync-mobile-bundle.sh"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Backup fixtures match their generator
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/gen-backup-fixtures.mjs --check

  # The npm packages that CI otherwise never builds: the bridge, the OpenClaw
  # plugin (which inlines the bridge's dist) and the scaffolder; and the
  # typecheck of every package, which needs all of those builds.
  packages:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build core, sdk, bridge, OpenClaw plugin and create-byoky-app
        run: |
          pnpm --filter @byoky/core build
          pnpm --filter @byoky/sdk build
          pnpm --filter @byoky/bridge build
          pnpm --filter @byoky/openclaw-plugin build
          pnpm --filter create-byoky-app build

      # Every package with a typecheck script: core, sdk, extension, bridge,
      # the OpenClaw plugin and create-byoky-app. The plugin resolves the
      # bridge's dist types and the extension WXT's generated .wxt types.
      - name: Typecheck
        run: |
          pnpm --filter @byoky/extension exec wxt prepare
          pnpm typecheck

      # OpenClaw's own install-time scanner on the plugin as it would be
      # published; a critical finding makes OpenClaw flag or refuse it.
      - name: OpenClaw install scan
        run: node scripts/scan-openclaw-plugin.mjs

      - name: Plugin dist checks
        run: npx vitest run packages/openclaw-plugin/tests

      # release.sh, the store scripts and ios-signing against throwaway repos
      # and a stubbed fetch (node:test, not vitest). The cases that run
      # release.sh past the version bump skip off macOS.
      - name: Release script tests
        run: node --test scripts/tests/*.test.mjs

  # Every create-byoky-app template, scaffolded by the CLI against this
  # commit's SDK, must install, build and typecheck. Needs the scaffolder's
  # --template flag (non-interactive).
  templates:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: [chat, multi-provider, backend-relay]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the scaffolder; pack core and sdk as they would publish
        run: |
          pnpm --filter @byoky/core build
          pnpm --filter @byoky/sdk build
          pnpm --filter create-byoky-app build
          mkdir -p "$RUNNER_TEMP/pkgs"
          (cd packages/core && pnpm pack --pack-destination "$RUNNER_TEMP/pkgs")
          (cd packages/sdk && pnpm pack --pack-destination "$RUNNER_TEMP/pkgs")

      - name: Scaffold ${{ matrix.template }}
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/packages/create-byoky-app/dist/index.js" smoke-app --template "${{ matrix.template }}" < /dev/null

      - name: Point the app at this commit's SDK
        working-directory: ${{ runner.temp }}/smoke-app
        run: |
          node -e '
            const fs = require("fs");
            const dir = process.env.RUNNER_TEMP + "/pkgs";
            const tgz = (prefix) => "file:" + dir + "/" + fs.readdirSync(dir).find((f) => f.startsWith(prefix) && f.endsWith(".tgz"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies["@byoky/sdk"] = tgz("byoky-sdk-");
            pkg.overrides = { ...pkg.overrides, "@byoky/core": tgz("byoky-core-") };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Install, build and typecheck
        working-directory: ${{ runner.temp }}/smoke-app
        run: |
          npm install --no-audit --no-fund
          # The build must not have to rewrite the app's own files: Next
          # installs a missing @types package into package.json (or, with CI
          # set, fails) and reshapes a tsconfig.json it disagrees with.
          mkdir -p ../before && cp package.json tsconfig.json ../before/
          npm run build --if-present
          npm run build:client --if-present
          npx tsc --noEmit
          diff -u ../before/package.json package.json
          diff -u ../before/tsconfig.json tsconfig.json

  # Fake-provider Playwright run: the real extension, headless, no keys.
  e2e:
    # Playwright 1.58 has no Chromium build for ubuntu-26.04 (ubuntu-latest
    # since October 2026); move up after bumping @playwright/test.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and run e2e
        run: pnpm test:e2e
      # The specs delete the wallet profiles they create (a live run's hold
      # the real keys); one left over means that cleanup broke.
      - name: No wallet profile left behind
        run: |
          left=$(find "${TMPDIR:-/tmp}" -maxdepth 1 -name 'byoky-e2e-*')
          if [ -n "$left" ]; then echo "::error::e2e left behind: $left"; exit 1; fi
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  android-unit:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/android
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unit-test-reports
          path: packages/android/app/build/reports/tests/
          retention-days: 7

  # Which changes the iOS suite has to see; the macOS runner is slow and
  # costly, so pushes and PRs that touch none of these skip it.
  ios-changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A new branch has no usable "before"; run then.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(packages/ios/|packages/core/(src|tests/vectors)/|packages/extension/|scripts/ios-unit-tests\.sh$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  ios-unit:
    needs: ios-changes
    if: needs.ios-changes.outputs.run == 'true'
    # The project uses an Icon Composer app icon and the iOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build core and the Safari extension the app embeds
        run: |
          pnpm --filter @byoky/core build
          pnpm --filter @byoky/sdk build
          pnpm --filter @byoky/extension build:safari
          packages/ios/Scripts/copy-wxt-output.sh

      - name: Generate the Xcode project
        working-directory: packages/ios
        run: |
          brew install xcodegen
          xcodegen generate

      # On a simulator of its own, booted before the tests start (a fresh one
      # failed to launch the test host now and then), with one more run on
      # that launch failure; deleted afterwards. Same script as release.sh.
      - name: ByokyTests
        run: bash scripts/ios-unit-tests.sh "$RUNNER_TEMP/DerivedData"
