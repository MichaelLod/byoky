name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  schedule:
    # Nightly, so the iOS suite (path-filtered on push and PR) still runs
    # against changes made elsewhere, e.g. in core's mobile bundle.
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR supersedes its run; branch pushes each get a
  # full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Active and maintenance LTS. Node 20 reached end of life on
        # 2026-04-30; the published packages require >=22.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @byoky/core build && pnpm --filter @byoky/sdk build

      # The iOS and Android apps run a committed copy of core's translate
      # bundle. The build is byte-identical on every Node version (esbuild),
      # so a difference means the copies are stale.
      - name: Mobile bundle copies match core
        run: |
          FAIL=0
          for copy in packages/ios/Byoky/Resources/mobile.js packages/android/app/src/main/assets/mobile.js; do
            if ! cmp -s packages/core/dist/mobile.js "$copy"; then
              echo "::error file=$copy::$copy differs from packages/core/dist/mobile.js. Run: pnpm --filter @byoky/core build && scripts/sync-mobile-bundle.sh"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Backup fixtures match their generator
        run: node scripts/gen-backup-fixtures.mjs --check

      - name: Run tests
        run: pnpm test

      - name: Build extension
        run: pnpm --filter @byoky/extension build

      - name: Build landing page
        run: pnpm --filter @byoky/web build

  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/android
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unit-test-reports
          path: packages/android/app/build/reports/tests/
          retention-days: 7

  # Which changes the iOS suite has to see; the macOS runner is slow and
  # costly, so pushes and PRs that touch none of these skip it.
  ios-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A new branch has no usable "before"; run then.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(packages/ios/|packages/core/(src|tests/vectors)/|packages/extension/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  ios-unit:
    needs: ios-changes
    if: needs.ios-changes.outputs.run == 'true'
    # The project uses an Icon Composer app icon and the iOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build core and the Safari extension the app embeds
        run: |
          pnpm --filter @byoky/core build
          pnpm --filter @byoky/sdk build
          pnpm --filter @byoky/extension build:safari
          packages/ios/Scripts/copy-wxt-output.sh

      - name: Generate the Xcode project
        working-directory: packages/ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Create a simulator
        id: sim
        run: |
          read -r RUNTIME DEVICE_TYPE < <(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last | "\(.identifier) \([.supportedDeviceTypes[] | select(.productFamily == "iPhone")] | first | .identifier)"')
          echo "Runtime $RUNTIME, device $DEVICE_TYPE"
          echo "udid=$(xcrun simctl create byoky-ci "$DEVICE_TYPE" "$RUNTIME")" >> "$GITHUB_OUTPUT"

      # Ad-hoc signing (not CODE_SIGNING_ALLOWED=NO): the keychain tests need
      # the entitlements a signed test host carries, or they fail with -34018.
      - name: ByokyTests
        working-directory: packages/ios
        run: |
          xcodebuild test \
            -project Byoky.xcodeproj -scheme Byoky \
            -only-testing:ByokyTests \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=

      - name: Delete the simulator
        if: always() && steps.sim.outputs.udid != ''
        run: xcrun simctl delete "${{ steps.sim.outputs.udid }}"
